# RMS reverse proxy.
#
# Replace rms.tn with your domain everywhere below before installing.
#
# One domain serves both the React app and the API. That keeps the browser on a
# single origin, so the web client needs no CORS preflight at all and
# REACT_APP_API_URL can simply be /api.

server {
    listen 80;
    listen [::]:80;
    server_name rms.tn www.rms.tn;

    # certbot writes its challenge here; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 (Ubuntu 24.04) takes http2 as a listen parameter. The
    # separate `http2 on;` directive is nginx >= 1.25.1 only and fails
    # `nginx -t` here with "unknown directive".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rms.tn www.rms.tn;

    ssl_certificate     /etc/letsencrypt/live/rms.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rms.tn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The largest multer limit in this app is 10MB (client permits in
    # routes/client.js, CIN scans in routes/rh.js). nginx defaults to 1MB, which
    # would reject those with a 413 before Express ever saw the request.
    client_max_body_size 12M;

    # The React production build.
    root /var/www/rms;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document generation over a full month can outlast the 60s default.
        proxy_read_timeout 120s;
    }

    # Stored files MUST be proxied to Node, never served by nginx directly.
    # routes/files.js is what checks the session and per-category ownership. A
    # static alias here would put every CIN scan, payslip and expense receipt
    # back on the open internet, undoing that fix.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CRA emits content-hashed filenames under /static, so these never change.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths return the app shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
