# Send anyone who reaches the server by its bare IP to the real HTTPS address.
#
# Before this, http://162.35.19.90 served the full app over plain HTTP, so the
# login password crossed the network unencrypted, and https://162.35.19.90
# showed a certificate warning and then refused every login with "Origine non
# autorisée" (that origin is not in CORS_ORIGINS). People found both by typing
# the IP.
#
# Install: sudo cp nginx-rms-ip-redirect.conf /etc/nginx/sites-available/rms-ip-redirect
#          sudo ln -sf /etc/nginx/sites-available/rms-ip-redirect /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/rms-temp
#          sudo nginx -t && sudo systemctl reload nginx
#
# When rms.tn goes live, change the target below to https://rms.tn.

# Plain HTTP on the IP, or any name this server has no site for.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Leave ACME challenges answerable so certbot can still validate here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://162-35-19-90.sslip.io$request_uri;
    }
}

# HTTPS on the IP. A certificate cannot be issued for a bare IP, so the browser
# still warns first; past the warning the visitor is sent to the right name
# instead of a login form that cannot work.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/162-35-19-90.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/162-35-19-90.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://162-35-19-90.sslip.io$request_uri;
}
