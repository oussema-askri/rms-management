# INTERIM vhost for 162-35-19-90.sslip.io.
#
# sslip.io is a public wildcard DNS service: any hostname of the form
# 162-35-19-90.sslip.io resolves to 162.35.19.90 with no DNS setup at all. That
# gives Let's Encrypt a real name to validate against, so this server can serve
# HTTPS before rms.tn is pointed here.
#
# The reason this exists: Android blocks cleartext HTTP by default, so the
# mobile app cannot talk to the bare IP at all. Without a certificate there is
# no way to test the APK until the client hands over their DNS panel.
#
# This is not the production config. Once rms.tn resolves to this server,
# install nginx-rms.conf, run certbot for rms.tn, and remove this file.
#
# Install: sudo cp nginx-rms-sslip.conf /etc/nginx/sites-available/rms-sslip
#          sudo ln -s /etc/nginx/sites-available/rms-sslip /etc/nginx/sites-enabled/
#          sudo certbot --nginx -d 162-35-19-90.sslip.io
#
# Deliberately NOT default_server: rms-temp keeps that, so plain-HTTP access on
# the bare IP goes on working for the web app while this name serves TLS.
# certbot rewrites this file to add the 443 block and the redirect. The 443
# listen lines it writes have no http2 parameter, so HTTP/2 must be added by
# hand afterwards -- and on nginx 1.24 that is `listen 443 ssl http2;`, not
# the `http2 on;` directive, which is 1.25.1 and newer only.

server {
    listen 80;
    listen [::]:80;
    server_name 162-35-19-90.sslip.io;

    # The largest multer limit in this app is 10MB (client permits in
    # routes/client.js, CIN scans in routes/rh.js). nginx defaults to 1MB,
    # which would reject those with a 413 before Express ever saw the request.
    client_max_body_size 12M;

    root /var/www/rms;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document generation over a full month can outlast the 60s default.
        proxy_read_timeout 120s;
    }

    # Stored files MUST be proxied to Node, never served by nginx directly.
    # routes/files.js is what checks the session and per-category ownership. A
    # static alias here would put every CIN scan, payslip and expense receipt
    # back on the open internet.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CRA emits content-hashed filenames under /static, so these never change.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths return the app shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
